<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f291e" />
      <stop offset="70%" stop-color="#08120e" />
      <stop offset="100%" stop-color="#040806" />
    </radialGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="warmHigh" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Emerald Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Automotive Chassis Silhouette -->
  <path d="M 200,680 L 450,420 L 850,400 L 1150,280 L 1600,280 L 1750,550 L 1780,820 L 220,820 Z" 
        fill="none" stroke="#1c3b2e" stroke-width="3" stroke-dasharray="10 8" opacity="0.4" />

  <!-- Technical Grid overlay -->
  <g stroke="#00ff88" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="200" x2="1920" y2="200" />
    <line x1="0" y1="400" x2="1920" y2="400" />
    <line x1="0" y1="600" x2="1920" y2="600" />
    <line x1="0" y1="800" x2="1920" y2="800" />
    <line x1="400" y1="0" x2="400" y2="1080" />
    <line x1="800" y1="0" x2="800" y2="1080" />
    <line x1="1200" y1="0" x2="1200" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>

  <!-- Refrigerant Cycle Lines -->
  <!-- Compressor to Condenser -->
  <path d="M 680,680 L 480,480" stroke="url(#warmHigh)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Condenser to TXV -->
  <path d="M 480,480 L 1050,480" stroke="#059669" stroke-width="6" stroke-linecap="round" />
  <!-- TXV to Evaporator -->
  <path d="M 1050,480 L 1320,620" stroke="url(#neonGreen)" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)" />
  <!-- Evaporator to Compressor -->
  <path d="M 1320,620 Q 1000,820 680,680" stroke="#00ff88" stroke-width="7" stroke-linecap="round" opacity="0.7" />

  <!-- Components -->
  <!-- Condenser -->
  <rect x="440" y="430" width="80" height="100" rx="8" fill="#12241c" stroke="#f59e0b" stroke-width="3" filter="url(#neonGlow)" />
  <text x="480" y="555" fill="#fbf8ee" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">CONDENSER</text>

  <!-- Compressor -->
  <circle cx="680" cy="680" r="55" fill="#12241c" stroke="#ef4444" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="680" cy="680" r="32" fill="#0b1612" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
  <text x="680" y="760" fill="#fbf8ee" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">COMPRESSOR</text>

  <!-- TXV -->
  <polygon points="1030,460 1070,480 1030,500" fill="#00ff88" stroke="#fbf8ee" stroke-width="2" />
  <polygon points="1070,460 1030,480 1070,500" fill="#059669" stroke="#fbf8ee" stroke-width="2" />
  <text x="1050" y="440" fill="#fbf8ee" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">EXPANSION VALVE</text>

  <!-- Evaporator Core -->
  <rect x="1280" y="560" width="80" height="120" rx="8" fill="#12241c" stroke="#00ff88" stroke-width="4" filter="url(#neonGlow)" />
  <text x="1320" y="705" fill="#00ff88" font-size="16" font-family="monospace" text-anchor="middle" font-weight="bold">EVAPORATOR</text>

  <!-- Cold Airflow into Cabin -->
  <path d="M 1360,580 C 1500,560 1620,600 1720,650" stroke="#00ff88" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  <path d="M 1360,620 C 1500,610 1620,640 1720,700" stroke="#00ff88" stroke-width="6" stroke-dasharray="10 8" opacity="0.9" />
  <path d="M 1360,660 C 1500,660 1620,690 1720,750" stroke="#00ff88" stroke-width="4" stroke-dasharray="8 6" opacity="0.8" />
  <text x="1600" y="600" fill="#fbf8ee" font-size="18" font-family="monospace" font-weight="bold">COLD AIR INFLOW</text>
</svg>
